services:
  - type: web
    name: baseline-security-demo
    env: node
    plan: free
    buildCommand: "echo 'No build step required for native Node.js'"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    # Note: Render Free Tier instances run SQLite in ephemeral storage (resets to demo seed on redeploy).
    # To attach a persistent disk on Render, upgrade plan to 'starter' and uncomment the block below:
    # plan: starter
    # disk:
    #   name: baseline-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1

